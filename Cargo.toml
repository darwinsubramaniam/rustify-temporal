[package]
name = "rustify-temporal"
version = "0.1.0"
edition = "2024"
resolver = "3"
description = "A Temporal-compatible workflow server written in Rust. Works with the official Temporal SDKs."
license = "MIT"

[[bin]]
name = "rustify-temporal"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.14.9", features = ["gzip"] }
tonic-prost = "0.14.9"
tonic-health = "0.14.9"
prost = "0.14.6"
prost-types = "0.14.6"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"

[build-dependencies]
tonic-prost-build = "0.14.9"

[profile.release]
debug = 1
